<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планировщик — Task Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/planner.css" />
  </head>

  <body data-page="planner">
    <!-- ===== Шапка: одинаковая на обеих страницах (общая зона) ===== -->
    <header class="header">
      <div class="container header__inner">
        <a class="logo" href="index.html">
          <span class="logo__icon" aria-hidden="true">✓</span>
          Task Planner
        </a>

        <nav class="nav" aria-label="Основная навигация">
          <a class="nav__link" href="index.html" data-page="planner">Планировщик</a>
          <a class="nav__link" href="stats.html" data-page="stats">Статистика</a>
        </nav>

        <button class="btn btn--primary" type="button" id="random-btn">🎲 Случайная задача</button>
      </div>
    </header>

    <!-- ===== Страница «Планировщик» (участник A) ===== -->
    <main class="main">
      <div class="container" id="app">
        <h1 class="page-title">Планировщик</h1>

        <!-- Прогресс -->
        <section class="progress-card" aria-label="Прогресс выполнения">
          <div class="progress-card__head">
            <p class="progress-card__title">Прогресс</p>
            <p class="progress-card__text" id="progress-text">Загрузка…</p>
          </div>
          <div
            class="progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progress"
          >
            <div class="progress__fill" id="progress-fill"></div>
          </div>
        </section>

        <!-- Вкладки + поиск -->
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="Фильтр задач">
            <button
              class="tab tab--active"
              type="button"
              role="tab"
              aria-selected="true"
              data-filter="all"
              onclick="setFilter('all')"
            >
              Все <span class="tab__count" id="count-all">0</span>
            </button>
            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-filter="active"
              onclick="setFilter('active')"
            >
              Активные <span class="tab__count" id="count-active">0</span>
            </button>
            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-filter="completed"
              onclick="setFilter('completed')"
            >
              Выполненные <span class="tab__count" id="count-completed">0</span>
            </button>
          </div>

          <label class="search">
            <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              class="search__input"
              type="search"
              id="search-input"
              placeholder="Поиск задач…"
              autocomplete="off"
              aria-label="Поиск задач"
            />
          </label>
        </div>

        <!-- Бонус: добавление своей задачи -->
        <form class="add-form" id="add-form">
          <input
            class="add-form__input"
            type="text"
            id="add-input"
            placeholder="Новая задача…"
            maxlength="200"
            autocomplete="off"
            aria-label="Текст новой задачи"
          />
          <button class="btn btn--primary" type="submit">Добавить</button>
        </form>

        <!-- Список задач -->
        <section class="task-list" id="task-list" aria-live="polite">
          <div class="loader" aria-label="Загрузка"></div>
        </section>

        <p class="list-footer" id="list-footer"></p>
      </div>
    </main>

    <!-- Порядок важен: axios → common.js → скрипт страницы -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/planner.js" defer></script>
  </body>
</html>
